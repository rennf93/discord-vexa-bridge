# ── Add this service to your Vexa docker-compose.yaml (same indentation as the other
#    services) so the bridge runs on the same network as `postgres` and
#    `transcription-worker`. Use the prebuilt image, or build from a local checkout.
#    Keep DISCORD_TOKEN and the DB password in a gitignored .env — never inline secrets.

  discord-vexa-bridge:
    image: ghcr.io/rennf93/discord-vexa-bridge:latest
    # Or build from a local checkout instead of the prebuilt image:
    # build:
    #   context: ./discord-vexa-bridge
    environment:
      DISCORD_TOKEN: "${DISCORD_TOKEN}"     # from a .env file — do NOT commit the token
      DATABASE_URL: "${DATABASE_URL:-postgresql://postgres:CHANGE_ME@postgres:5432/vexa}"
      TRANSCRIBE_URL: http://transcription-worker:8000/v1/audio/transcriptions
      VEXA_USER_ID: "1"          # the Vexa user id that owns these meetings
      LANGUAGE: ""               # "" = autodetect (leave blank for mixed it/es/en)
      SILENCE_MS: "800"          # gap (ms) that ends an utterance
      # COMPLETION_WEBHOOK_URL: "https://your-obsidian-bridge.example/webhooks/vexa"  # optional; unset = feature off
      # COMPLETION_WEBHOOK_SECRET: "${COMPLETION_WEBHOOK_SECRET}"  # required once the URL above is set
    depends_on: [postgres, transcription-worker]
    volumes:
      # Durable segment queue: spilled segments survive transcription-worker 503s,
      # bot restarts, AND image updates. WITHOUT this, /data/pending lives in the
      # container's ephemeral writable layer and `compose up -d` (image pull) wipes
      # every pending segment — silently losing captured audio on the next deploy.
      - discord-pending:/data/pending
    networks: [vexa]
    restart: unless-stopped

# And declare the volume at the top level of your docker-compose.yaml:
#   volumes:
#     discord-pending:
