name: Greetings

on: [pull_request_target, issues]

permissions:
  issues: write
  pull-requests: write

jobs:
  greeting:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/first-interaction@v3
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          issue-message: >
            Thanks for opening your first issue on discord-vexa-bridge! A maintainer will take a look.
            If it's about transcripts not appearing, please confirm Vexa accepts the `discord`
            platform (see Step 2 in the README).
          pr-message: >
            Thanks for your first pull request! Please make sure `make lint` and `make test` pass.
