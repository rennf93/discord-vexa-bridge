name: CI

on:
  push:
    branches: [master]
    paths:
      - 'bot.py'
      - 'completion_webhook.py'
      - 'dave_voice/**'
      - 'tests/**'
      - 'pyproject.toml'
      - '.pre-commit-config.yaml'
      - 'Dockerfile'
      - 'requirements.txt'
      - '.github/workflows/ci.yml'
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install uv
      - run: uv sync --extra dev
      - run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - run: pip install uv
      - run: uv sync --extra dev
      - name: Run tests
        run: uv run pytest -v

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build image
        run: docker build -t discord-vexa-bridge:ci .
      - name: Smoke test (Python 3.11 + audioop + deps import inside the image)
        run: |
          docker run --rm discord-vexa-bridge:ci python -c "import sys; assert sys.version_info[:2] == (3, 11), sys.version; import audioop, discord, dave, asyncpg, aiohttp, nacl; import dave_voice.voice_client; print('image OK', sys.version)"
