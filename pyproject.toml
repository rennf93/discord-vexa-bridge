[project]
name = "discord-vexa-bridge"
version = "0.4.0"
description = "Bridge Discord voice (DAVE/E2EE) into Vexa: per-user transcription written straight to Vexa's Postgres."
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Renzo Franceschini" }]
# Pinned to 3.11: depends on the stdlib `audioop` module, removed in Python 3.13.
requires-python = ">=3.11,<3.12"
dependencies = [
    "py-cord[voice]>=2.8",
    "asyncpg",
    "aiohttp",
    "dave.py",
    "websockets",
    "cryptography",
    "PyNaCl",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "bandit",
    "pre-commit",
]
# Summarizer runs on the Mac (not in the adapter image). Install with: uv sync --extra summarizer
summarizer = [
    "litellm",
]

[project.urls]
Homepage = "https://github.com/rennf93/discord-vexa-bridge"
Repository = "https://github.com/rennf93/discord-vexa-bridge"
Issues = "https://github.com/rennf93/discord-vexa-bridge/issues"

# This is a runnable application, not a published package — don't try to build it.
[tool.uv]
package = false

[tool.ruff]
target-version = "py311"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
